name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify project
        shell: zsh {0}
        run: |
          set -o pipefail
          Scripts/ci/verify.sh 2>&1 | tee verify.log

      - name: Surface failures as annotations
        if: failure()
        run: |
          if [ -f verify.log ]; then
            grep -E "error:|failed|Fatal|recorded an issue" verify.log | sort -u | head -n 40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
